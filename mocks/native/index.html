<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Convent Profile</title>
<style>
:root { --vellum: #F5F2E9; --ink: #1A1A1A; --red: #8B0000; }
body { background: var(--vellum); color: var(--ink); font-family: 'Courier New', Courier, monospace; margin: 0; padding: 0; overflow-x: hidden; }
.screen { display: none; padding: 2rem; min-height: 100vh; box-sizing: border-box; padding-bottom: 80px; }
.screen.active { display: block; }

/* Brutalist Typography */
h1 { font-size: 3rem; line-height: 0.9; text-transform: uppercase; border-bottom: 8px solid var(--ink); margin-bottom: 1rem; }
.pitch { font-size: 1.2rem; font-weight: bold; margin-bottom: 3rem; max-width: 600px; }

/* Search */
.search-box { border: 3px solid var(--ink); padding: 1rem; background: transparent; width: 100%; font-family: inherit; font-size: 1.5rem; outline: none; box-sizing: border-box; }
.search-box:focus { background: var(--ink); color: var(--vellum); }

/* Directory */
.entry { border-bottom: 1px solid var(--ink); padding: 1rem 0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: color 0.2s; }
.entry:hover { color: var(--red); }

/* Detail View */
.detail-header { font-size: 2rem; text-transform: uppercase; color: var(--red); margin-bottom: 2rem; }
.coord-box { font-size: 1.5rem; border: 2px dashed var(--ink); padding: 1rem; display: inline-block; min-width: 300px; margin-bottom: 2rem; }
.map-sketch { width: 100%; height: 200px; border: 2px solid var(--ink); position: relative; background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.05) 10px, rgba(0,0,0,0.05) 20px); }
.map-dot { position: absolute; width: 10px; height: 10px; background: var(--red); border-radius: 50%; top: 50%; left: 50%; }

/* Nav */
nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: var(--ink); color: var(--vellum); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
nav a { color: var(--vellum); text-decoration: none; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; }
nav a:hover { color: var(--red); }

.typewriter { overflow: hidden; white-space: nowrap; border-right: .15em solid var(--red); animation: typing 1.5s steps(30, end), blink-caret .75s step-end infinite; }
@keyframes typing { from { width: 0 } to { width: 100% } }
@keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: var(--red); } }
</style>
</head>
<body>

<div id="home" class="screen active">
    <h1>The Convent Profile</h1>
    <p class="pitch">Unearth the hidden geography of sacred silence.</p>
    <input type="text" class="search-box" placeholder="Search the Cloister...">
    <div style="margin-top: 3rem;">
        <div class="entry" onclick="location.hash='#/s/1'">Sainte-Marie de la Croix <span>&rarr;</span></div>
        <div class="entry" onclick="location.hash='#/s/2'">Order of the Silent Word <span>&rarr;</span></div>
        <div class="entry" onclick="location.hash='#/s/3'">Cloister of Eternal Vigil <span>&rarr;</span></div>
    </div>
</div>

<div id="detail" class="screen">
    <div id="detail-content">
        <!-- Dynamic Content -->
    </div>
</div>

<div id="map" class="screen">
    <h1>Global Silence</h1>
    <div class="map-sketch" style="height: 70vh;">
        <div class="map-dot" style="top:30%; left:40%"></div>
        <div class="map-dot" style="top:60%; left:70%"></div>
        <div class="map-dot" style="top:20%; left:80%"></div>
    </div>
    <p>Archival map view: 14 active nodes detected.</p>
</div>

<nav>
    <a href="#/">Directory</a>
    <a href="#/map">Map</a>
</nav>

<script>
const data = {
    '1': { name: 'Sainte-Marie de la Croix', coords: '43.8565° N, 2.3248° E' },
    '2': { name: 'Order of the Silent Word', coords: '51.5074° N, 0.1278° W' },
    '3': { name: 'Cloister of Eternal Vigil', coords: '34.0522° N, 118.2437° W' }
};

function router() {
    const hash = location.hash || '#/';
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    
    if (hash === '#/' || hash === '') {
        document.getElementById('home').classList.add('active');
    } else if (hash === '#/map') {
        document.getElementById('map').classList.add('active');
    } else if (hash.startsWith('#/s/')) {
        const id = hash.split('/s/')[1];
        const convent = data[id] || { name: 'Unknown', coords: '0.0000, 0.0000' };
        const detail = document.getElementById('detail');
        detail.classList.add('active');
        document.getElementById('detail-content').innerHTML = `
            <div class="detail-header">${convent.name}</div>
            <div class="coord-box"><span class="typewriter">${convent.coords}</span></div>
            <div class="map-sketch"><div class="map-dot"></div></div>
            <p style="margin-top:2rem">Status: Secluded<br>Access: Restricted</p>
        `;
    }
}

window.addEventListener('hashchange', router);
window.addEventListener('load', router);
</script>
</body>
</html>
